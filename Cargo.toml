[package]
name = "anicraft-360-studio-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Standalone egui prototype for the AniCraft 360 Studio workspace"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"

[features]
default = []
anicraft-host = ["dep:anicraft-engine", "dep:anicraft-render"]

[dependencies.anicraft-engine]
git = "https://github.com/storytold/anicraft"
package = "anicraft-engine"
optional = true

[dependencies.anicraft-render]
git = "https://github.com/storytold/anicraft"
package = "anicraft-render"
optional = true
