[workspace]
resolver = "3"
members = ["crates/anicraft-360-ui", "crates/anicraft-360-model"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Keep aligned with the egui version used by the AniCraft host.
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
